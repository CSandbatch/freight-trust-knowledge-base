name: Knowledge base validation

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/validate_kb.py
      - run: python scripts/build_site.py --site-url https://ci.invalid/freight-trust/ --source-date-epoch 0
      - run: python scripts/validate_site.py --check-deterministic --site-url https://ci.invalid/freight-trust/
      - run: python -m unittest discover -s tests -p "test_*.py"
