# Private demo runtime for the BellHill Knowledge Agent.
# The browser-facing server requires a signed demo session before proxying requests.
model:
  default: z-ai/glm-5.3-flash
  provider: openrouter
  fallback_providers: []

platform_toolsets:
  api_server:
    - hermes-api-server

gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8642
    model_name: hermes-agent
    max_concurrent_runs: 4
